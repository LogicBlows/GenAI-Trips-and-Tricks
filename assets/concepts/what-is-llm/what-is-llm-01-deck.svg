<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">What is an LLM</title>
  <desc id="d">Deck slide: text in, predicted tokens out</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D3FC9"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <rect x="48" y="48" width="1184" height="96" rx="12" fill="#3D3FC9"/>
  <text x="80" y="108" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">What is an LLM?</text>
  <text x="80" y="200" fill="#161B2E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Large Language Model = next-token prediction</text>
  <rect x="80" y="240" width="420" height="200" rx="14" fill="#fff" stroke="#E4E0D6" stroke-width="2"/>
  <text x="110" y="290" fill="#5B6070" font-family="Segoe UI, Arial, sans-serif" font-size="22">Input (prompt)</text>
  <text x="110" y="340" fill="#161B2E" font-family="Consolas, monospace" font-size="20">Explain DI in .NET</text>
  <path d="M520 340 L620 340" stroke="#3D3FC9" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="640" y="240" width="420" height="200" rx="14" fill="#12162A"/>
  <text x="670" y="290" fill="#8FF7C4" font-family="Segoe UI, Arial, sans-serif" font-size="22">Model</text>
  <text x="670" y="340" fill="#8FF7C4" font-family="Segoe UI, Arial, sans-serif" font-size="18">Weights learned from training</text>
  <path d="M1080 340 L1180 340" stroke="#3D3FC9" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="80" y="480" width="980" height="160" rx="14" fill="#ECEBFB" stroke="#3D3FC9" stroke-width="2"/>
  <text x="110" y="530" fill="#161B2E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Output (generated tokens)</text>
  <text x="110" y="580" fill="#161B2E" font-family="Consolas, monospace" font-size="18">Dependency injection lets you register services...</text>
</svg>
