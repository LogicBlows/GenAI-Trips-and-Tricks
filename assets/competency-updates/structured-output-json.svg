<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#12162A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="56" y="56" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">.NET COMPETENCY</text>
  <text x="268" y="56" fill="#8FA3BF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500">Contributed by Harshit Gupta</text>
  <text x="56" y="118" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Structured JSON output</text>
  <rect x="56" y="132" width="380" height="4" fill="#00E5FF"/>
  <text x="56" y="178" fill="#B8C5D6" font-family="Segoe UI, Arial, sans-serif" font-size="22">Text is for people. JSON is for code.</text>

  <rect x="56" y="210" width="580" height="250" rx="14" fill="#1A2844" stroke="#2A3A5C"/>
  <text x="80" y="248" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">WHAT IT IS</text>
  <text x="80" y="286" fill="#E8EDF4" font-family="Segoe UI, Arial, sans-serif" font-size="19">Model returns fields your app can deserialize:</text>
  <text x="80" y="318" fill="#8FA3BF" font-family="Segoe UI, Arial, sans-serif" font-size="17">category, priority, refundEligible - not prose you regex by hand.</text>
  <text x="80" y="368" fill="#A8C8FF" font-family="Consolas, monospace" font-size="16">{</text>
  <text x="96" y="396" fill="#8FF7C4" font-family="Consolas, monospace" font-size="15">"category": "order_quality",</text>
  <text x="96" y="422" fill="#8FF7C4" font-family="Consolas, monospace" font-size="15">"priority": "high",</text>
  <text x="96" y="448" fill="#8FF7C4" font-family="Consolas, monospace" font-size="15">"refundEligible": true</text>
  <text x="80" y="476" fill="#8FA3BF" font-family="Consolas, monospace" font-size="16">}</text>

  <rect x="662" y="210" width="562" height="380" rx="14" fill="#1A2844" stroke="#2A3A5C"/>
  <text x="686" y="248" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">WHAT MAKES IT RELIABLE</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E8EDF4">
    <circle cx="702" cy="288" r="5" fill="#00E5FF"/>
    <text x="718" y="293" font-weight="600">Name every field</text>
    <text x="718" y="318" fill="#8FA3BF" font-size="16">Exact names your C# model expects</text>
    <circle cx="702" cy="352" r="5" fill="#00E5FF"/>
    <text x="718" y="357" font-weight="600">Fix the values</text>
    <text x="718" y="382" fill="#8FA3BF" font-size="16">Allowed lists: low | medium | high</text>
    <circle cx="702" cy="416" r="5" fill="#00E5FF"/>
    <text x="718" y="421" font-weight="600">JSON only</text>
    <text x="718" y="446" fill="#8FA3BF" font-size="16">No greeting, no markdown fences</text>
    <circle cx="702" cy="480" r="5" fill="#00E5FF"/>
    <text x="718" y="485" font-weight="600">Show one example</text>
    <text x="718" y="510" fill="#8FA3BF" font-size="16">Teaches shape before the real input</text>
    <circle cx="702" cy="544" r="5" fill="#00E5FF"/>
    <text x="718" y="549" font-weight="600">Validate in code</text>
    <text x="718" y="574" fill="#8FA3BF" font-size="16">Schema helps format; you still check meaning</text>
  </g>

  <rect x="56" y="480" width="580" height="110" rx="14" fill="#003D4D" stroke="#00E5FF" stroke-width="1"/>
  <text x="80" y="522" fill="#FFFFFF" font-family="Consolas, monospace" font-size="15">if (complaint.Priority == "high") Escalate(complaint);</text>
  <text x="80" y="560" fill="#8FA3BF" font-family="Segoe UI, Arial, sans-serif" font-size="16">API structured outputs enforce schema; prompt rules still apply.</text>

  <text x="56" y="698" fill="#5B6070" font-family="Segoe UI, Arial, sans-serif" font-size="15">Building AI Features in .NET</text>
</svg>