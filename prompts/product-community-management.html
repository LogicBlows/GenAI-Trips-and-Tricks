<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product community management — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--product">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Community</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--product">Product</span><span class="prompt-meta-pill">ChatGPT</span></div>
      <h1>Product community management</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <label class="prompt-field"><span class="prompt-field-label">Product name</span>
          <input type="text" class="prompt-input" data-prompt-var="product_name" autocomplete="off"></label>
        <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Current challenges</span>
          <textarea class="prompt-textarea" data-prompt-var="list_of_challenges" rows="3" placeholder="low post frequency, unanswered questions, duplicate threads"></textarea></label>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>As a product manager for {product_name}, I am looking for ways to improve our community management strategy.

Our current challenges include: {list_of_challenges}

We aim to increase user engagement and satisfaction.

Provide recommendations on how to address these challenges and improve community management, including:
- Engagement tactics (events, AMAs, champions program, content cadence)
- Ways to gather structured feedback without survey fatigue
- Methods to identify, triage, and solve common user issues
- Metrics to track weekly (with targets as examples)
- Moderation and escalation guidelines for internal communities

Tailor for a professional / enterprise user base if relevant.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
