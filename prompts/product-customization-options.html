<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product customization options — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--product">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Customization</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--product">Product Management</span><span class="prompt-meta-pill">ChatGPT</span></div>
      <h1>Product customization options</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <label class="prompt-field"><span class="prompt-field-label">Product name</span>
          <input type="text" class="prompt-input" data-prompt-var="product_name" autocomplete="off"></label>
        <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Customization options under consideration</span>
          <textarea class="prompt-textarea" data-prompt-var="list_of_customization_options" rows="3" placeholder="tier level, add-on modules, seat count, branding"></textarea></label>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>As a product manager, I am looking to offer customizable options for my product {product_name}.

The customization options I am considering are: {list_of_customization_options}

Based on typical market research and customer preferences (state assumptions clearly), provide:
- The most popular combinations of customization options and why
- Potential challenges or limitations (operations, support, engineering, margin)
- Pricing strategies for customized options that protect profitability while delivering customer value
- A recommendation: which options to launch first in an MVP customization catalog

Use ranges and illustrative prices, not confidential internal numbers.</script>
    </div>
    <footer class="site-footer">
      <p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p>
      <p class="song-of-week"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=fu7vlU0Quow&amp;list=RDfu7vlU0Quow&amp;start_radio=1">♪ song of the week</a></p>
    </footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
