<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hashtag campaign ideas — GenAI Adoption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=3">
</head>
<body class="prompt-page prompt-page--marketing">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a href="index.html">Useful prompts</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Hashtag campaign</span>
    </nav>
    <header class="site-header">
      <div class="prompt-meta-row">
        <span class="prompt-badge prompt-badge--marketing">Marketing</span>
        <span class="prompt-meta-pill">ChatGPT</span>
      </div>
      <h1>Hashtag campaign ideas</h1>
      <p class="subtitle">Unique tags for buzz and engagement on social.</p>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <h2 class="prompt-section-title">Customize</h2>
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Product name</span>
            <input type="text" class="prompt-input" data-prompt-var="product_name" placeholder="FlowSave" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Number of hashtags</span>
            <input type="text" class="prompt-input" data-prompt-var="number_of_hashtags" placeholder="8" autocomplete="off"></label>
          <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Product function</span>
            <input type="text" class="prompt-input" data-prompt-var="product_function" placeholder="help teams automate savings goals" autocomplete="off"></label>
          <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Target audience</span>
            <input type="text" class="prompt-input" data-prompt-var="target_audience" placeholder="young professionals learning to budget" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header">
          <h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button>
        </div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>I am launching a marketing campaign for {product_name}, designed to {product_function}.

Target audience: {target_audience}

Suggest {number_of_hashtags} unique, catchy hashtag ideas that:
- Resonate with this audience
- Represent the product's value
- Are easy to spell and unlikely to collide with unrelated trends

For each hashtag add: rationale, example post caption (1–2 lines), and a note on whether to check trademark/conflict risk.

Propose one primary campaign hashtag and 2–3 supporting tags.</script>
    </div>
    <footer class="site-footer">
      <p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p>
      <p class="song-of-week"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=fu7vlU0Quow&amp;list=RDfu7vlU0Quow&amp;start_radio=1">♪ song of the week</a></p>
    </footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
