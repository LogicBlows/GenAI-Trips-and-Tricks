<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit tests — CancelAsync — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--programming">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">CancelAsync tests</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--programming">Programming</span><span class="prompt-meta-pill">xUnit</span><span class="prompt-meta-pill">Moq</span></div>
      <h1>Unit tests for CancelAsync</h1>
      <p class="subtitle">AAA tests aligned with your existing OrderServiceTests.</p>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Service file</span>
            <input type="text" class="prompt-input" data-prompt-var="service_file" value="OrderService.cs" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Tests file</span>
            <input type="text" class="prompt-input" data-prompt-var="tests_file" value="OrderServiceTests.cs" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>Write unit tests for the CancelAsync method in {service_file}.

Use xUnit and Moq, following the patterns in {tests_file}.
Cover:
- Happy path: order is cancelled successfully
- Order not found: should throw NotFoundException (or the project's equivalent)
- Order already cancelled: should throw InvalidOperationException (or the project's equivalent)
- Any other cases you identify from reading the implementation

Use the AAA pattern and descriptive test names. Mock only boundaries used by CancelAsync. Do not change production code unless a bug is found — call it out separately.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
