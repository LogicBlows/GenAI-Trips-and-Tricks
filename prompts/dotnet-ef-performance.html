<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EF performance diagnosis — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--programming">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">EF performance</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--programming">Programming</span><span class="prompt-meta-pill">EF Core</span></div>
      <h1>Diagnose slow repository query</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Repository method (file and name)</span>
          <input type="text" class="prompt-input" data-prompt-var="method_ref" value="OrderRepository.GetDashboardSummaryAsync" autocomplete="off"></label>
        <label class="prompt-field"><span class="prompt-field-label">Observed latency (prod)</span>
          <input type="text" class="prompt-input" data-prompt-var="latency" value="2-3 seconds" autocomplete="off"></label>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>This repository method is slow in production ({latency}). It runs in under 10ms in development but is slow with production data volumes.

Method: {method_ref}

Questions:
1. What SQL will EF Core generate for this query?
2. What indexes would improve this query's performance?
3. Are there any N+1 query risks in this method?
4. Could this be rewritten as a more efficient query?

Read the implementation and related entities. Suggest changes ranked by impact. Mention how to validate with EF logging or a query plan — do not assume you can run against prod.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
