<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social media contest — GenAI Adoption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="prompt-page prompt-page--marketing">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a href="index.html">Useful prompts</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Social contest</span>
    </nav>
    <header class="site-header">
      <div class="prompt-meta-row">
        <span class="prompt-badge prompt-badge--marketing">Marketing</span>
        <span class="prompt-meta-pill">ChatGPT</span>
      </div>
      <h1>Social media contest</h1>
      <p class="subtitle">Creative concept, format, and rules for engagement.</p>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <h2 class="prompt-section-title">Customize</h2>
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Brand name</span>
            <input type="text" class="prompt-input" data-prompt-var="brand_name" placeholder="GreenLeaf Co-op" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Platform</span>
            <input type="text" class="prompt-input" data-prompt-var="platform_name" placeholder="Instagram" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Contest duration</span>
            <input type="text" class="prompt-input" data-prompt-var="contest_duration" placeholder="14 days" autocomplete="off"></label>
          <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Target audience</span>
            <input type="text" class="prompt-input" data-prompt-var="target_audience" placeholder="local eco-conscious shoppers" autocomplete="off"></label>
          <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Prize description</span>
            <input type="text" class="prompt-input" data-prompt-var="prize_description" placeholder="£200 store voucher + reusable kit" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header">
          <h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button>
        </div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>Plan a social media contest for {brand_name} to increase engagement and brand awareness.

Audience: {target_audience}
Platform: {platform_name}
Duration: {contest_duration}
Prize: {prize_description}

Suggest:
1. A creative contest idea and theme that fits the brand
2. Format (photo, video, caption, tag-a-friend, etc.) optimised for {platform_name}
3. Participation rules (eligibility, how to enter, hashtag, deadline)
4. Draft announcement post and reminder post
5. Winner selection method and compliance notes (UK promotional marketing basics — mark [LEGAL REVIEW])

Keep rules clear and scannable.</script>
    </div>
    <footer class="site-footer">
      <p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p>
      <p class="song-of-week"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=2KdymN0xDQQ&amp;list=RD2KdymN0xDQQ&amp;start_radio=1">♪ song of the week</a></p>
    </footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
