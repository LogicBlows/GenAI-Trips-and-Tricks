<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request logging middleware — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<body class="prompt-page prompt-page--programming">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Request logging</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--programming">Programming</span><span class="prompt-meta-pill">ASP.NET Core</span></div>
      <h1>Request logging middleware</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <label class="prompt-field"><span class="prompt-field-label">Program file</span>
          <input type="text" class="prompt-input" data-prompt-var="program_file" value="Program.cs" autocomplete="off"></label>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>Add request logging middleware to this ASP.NET Core application.

Requirements:
- Log the HTTP method, path, status code, and duration for every request
- Use the existing ILogger&lt;T&gt; pattern — do not introduce a new logging library
- Log at Information level for 2xx/3xx, Warning for 4xx, Error for 5xx
- Exclude health check endpoints from logging
- Register in {program_file} in the correct position in the pipeline

Follow existing middleware conventions in the project (extension method vs inline). Do not log request bodies or auth headers.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
