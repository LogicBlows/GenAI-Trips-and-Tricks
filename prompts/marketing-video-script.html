<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing video script — GenAI Adoption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=3">
</head>
<body class="prompt-page prompt-page--marketing">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a href="index.html">Useful prompts</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Video script</span>
    </nav>
    <header class="site-header">
      <div class="prompt-meta-row">
        <span class="prompt-badge prompt-badge--marketing">Marketing</span>
        <span class="prompt-meta-pill">ChatGPT</span>
        <span class="prompt-meta-pill">Cursor</span>
      </div>
      <h1>Marketing video script</h1>
      <p class="subtitle">Captivating script with features, benefits, and a clear CTA.</p>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <h2 class="prompt-section-title">Customize</h2>
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Product name</span>
            <input type="text" class="prompt-input" data-prompt-var="product_name" placeholder="SecurePay Hub" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Video duration</span>
            <input type="text" class="prompt-input" data-prompt-var="video_duration" placeholder="90 seconds" autocomplete="off"></label>
          <label class="prompt-field prompt-field--wide"><span class="prompt-field-label">Product description</span>
            <textarea class="prompt-textarea" data-prompt-var="product_description" rows="3" placeholder="API-first payments orchestration for mid-size merchants"></textarea></label>
          <label class="prompt-field"><span class="prompt-field-label">Target audience</span>
            <input type="text" class="prompt-input" data-prompt-var="target_audience" placeholder="e-commerce product and engineering leads" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Marketing goal</span>
            <input type="text" class="prompt-input" data-prompt-var="marketing_goal" placeholder="drive demo requests" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header">
          <h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button>
        </div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>Draft a marketing video script for {product_name}.

Product: {product_description}
Audience: {target_audience}
Goal: {marketing_goal}
Length: about {video_duration}

Include:
- Hook (first 5 seconds)
- Problem → solution narrative
- Key features, benefits, and differentiators (not feature dumps)
- Social proof placeholder (stat or quote — mark as [VERIFY])
- Clear CTA aligned to the goal

Format as table: Timecode | Visual/B-roll | Voiceover | On-screen text

Tone: professional, confident, no hype. British English.</script>
    </div>
    <footer class="site-footer">
      <p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p>
      <p class="song-of-week"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=fu7vlU0Quow&amp;list=RDfu7vlU0Quow&amp;start_radio=1">♪ song of the week</a></p>
    </footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
