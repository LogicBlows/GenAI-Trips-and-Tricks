<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security review — orders API — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--programming">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Security review</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--programming">Programming</span><span class="prompt-meta-pill">Security</span></div>
      <h1>Review controller and service for security</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Controller file</span>
            <input type="text" class="prompt-input" data-prompt-var="controller_file" value="OrdersController.cs" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Service file</span>
            <input type="text" class="prompt-input" data-prompt-var="service_file" value="OrderService.cs" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>Review {controller_file} and {service_file} for security issues.

Context: this endpoint is called by authenticated users. Each user should only be able to access and modify their own orders. The current user's ID is available via User.GetUserId() (an extension method).

Check specifically for:
- Missing authorisation checks (can one user access another user's data?)
- Input validation gaps
- Sensitive data in responses that shouldn't be there
- Any SQL or injection risks

Output: findings by severity (critical / high / medium / low) with file/line references and concrete fix suggestions. Do not refactor unrelated code.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
