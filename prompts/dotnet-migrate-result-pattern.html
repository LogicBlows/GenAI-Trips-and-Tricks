<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrate to Result&lt;T&gt; — GenAI Adoption</title>
  <link rel="stylesheet" href="../styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="prompt-page prompt-page--programming">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><a href="index.html">Useful prompts</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Result pattern</span></nav>
    <header class="site-header">
      <div class="prompt-meta-row"><span class="prompt-badge prompt-badge--programming">Programming</span><span class="prompt-meta-pill">.NET</span></div>
      <h1>Migrate service method to Result&lt;T&gt;</h1>
    </header>
    <div class="prompt-panel" data-prompt-root>
      <section class="prompt-customize" aria-label="Customize placeholders">
        <div class="prompt-fields">
          <label class="prompt-field"><span class="prompt-field-label">Reference method</span>
            <input type="text" class="prompt-input" data-prompt-var="reference" value="OrderService.PlaceOrderAsync" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Method to migrate</span>
            <input type="text" class="prompt-input" data-prompt-var="target" value="UserService.RegisterAsync" autocomplete="off"></label>
          <label class="prompt-field"><span class="prompt-field-label">Result type file</span>
            <input type="text" class="prompt-input" data-prompt-var="result_file" value="Result.cs" autocomplete="off"></label>
        </div>
      </section>
      <section class="prompt-output-wrap" aria-label="Prompt text">
        <div class="prompt-output-header"><h2 class="prompt-section-title">Prompt</h2>
          <button type="button" class="prompt-copy-btn" data-prompt-copy><span class="prompt-copy-label" data-default-label="Copy prompt">Copy prompt</span></button></div>
        <pre class="prompt-output"><code data-prompt-output></code></pre>
      </section>
      <script type="text/plain" data-prompt-template>We're migrating from throwing exceptions for domain validation failures to returning Result&lt;T&gt;. {reference} is the reference implementation of the new pattern.

Apply the same pattern to {target}.

The Result&lt;T&gt; type is defined in {result_file}.
Keep the same business logic — only change the error-handling mechanism.

Update callers and tests affected by the signature change. List breaking changes for API layers.</script>
    </div>
    <footer class="site-footer"><p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p></footer>
  </main>
  <script src="prompt-page.js"></script>
</body>
</html>
