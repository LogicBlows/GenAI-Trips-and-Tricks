<body class="tip-page tip-page--cursor">
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a href="index.html">Tips &amp; tricks</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">One task, one chat</span>
    </nav>

    <header class="site-header">
      <div class="tip-brand-row">
        <img class="tip-tool-logo" src="../assets/brands/cursor.svg" alt="" width="28" height="28">
        <span class="tip-brand-label">Cursor</span>
      </div>
      <h1>One task, one chat</h1>
      <p class="meta-line">
        8 Oct 2026
        <span class="meta-dot" aria-hidden="true">·</span>
        Optimization
      </p>
    </header>

    <article class="prose">
      <figure class="tip-share-card" aria-label="Tip infographic">
        <p class="tip-share-eyebrow">DOT NET GEN AI ADOPTION</p>
        <p class="tip-share-sub">Cursor Tricks · Optimization</p>

        <div class="tip-share-highlight">
          <h3>One task, one chat</h3>
          <p>Cursor getting slower, vaguer, or forgetful deep into a chat? Every message drags the whole conversation along with it — one long chat means more tokens spent and weaker answers.</p>
        </div>

        <div class="tip-share-columns">
          <div class="tip-share-col tip-share-col-bad">
            <p class="tip-share-col-label">✕ Instead of this</p>
            <div class="tip-share-chat">
              <strong>Chat #1 (getting long…)</strong>
              <ul>
                <li>Fix login bug</li>
                <li>Refactor the service</li>
                <li>Write the docs</li>
                <li>Add new endpoint</li>
              </ul>
            </div>
            <p class="tip-share-col-note">Old tasks pile up and get re-sent with every reply.</p>
          </div>
          <div class="tip-share-col tip-share-col-good">
            <p class="tip-share-col-label">✓ Do this</p>
            <div class="tip-share-mini-chats">
              <div class="tip-share-mini"><strong>Chat #1</strong> — Fix login bug</div>
              <div class="tip-share-mini"><strong>Chat #2</strong> — Refactor the service</div>
              <div class="tip-share-mini"><strong>Chat #3</strong> — Write the docs</div>
              <div class="tip-share-mini"><strong>Chat #4</strong> — Add new endpoint</div>
            </div>
            <p class="tip-share-col-note">Small context per chat: sharper answers, fewer tokens.</p>
          </div>
        </div>

        <div class="tip-share-how">
          <p class="tip-share-how-title">How</p>
          <div class="tip-share-steps">
            <span class="tip-share-step-pill">1. Finish the task</span>
            <span class="tip-share-step-arrow" aria-hidden="true">→</span>
            <span class="tip-share-step-pill">2. Open a new chat</span>
            <span class="tip-share-step-arrow" aria-hidden="true">→</span>
            <span class="tip-share-step-pill">3. Start the next task fresh</span>
          </div>
          <p class="tip-share-footer">Try it for a day and notice the difference.</p>
        </div>
      </figure>

      <p style="font-size:0.9375rem;color:var(--ink-soft);margin-top:1.5rem;">Related: <a href="../tools/cursor.html">Cursor skills</a></p>
    </article>

    <footer class="site-footer">
      <p class="site-footer-main">Maintained by the .NET GenAI Adoption initiative · updated weekly.</p>
